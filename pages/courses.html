<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Courses</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />

    <style>
      .card-img-top {
        width: 100%;
        height: 250px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <nav
      class="d-flex justify-content-between align-items-center px-4 py-2"
      style="background-color: #4d78b9"
    >
      <a href="/" class="nav-logo d-flex align-items-center">
        <img
          src="/assets/images/image.jpg"
          alt="EduSphere Logo"
          style="height: 50px"
        />
      </a>

      <div class="nav-links d-flex align-items-center gap-4">
        <a href="#home" class="text-white">Home</a>
        <a href="#courses" class="text-white"
          >Courses</a
        >
        <a
          href="#topratedcourses"
          class="text-white"
          >Top Rated Courses</a
        >

        <div class="dropdown">
          <a
            href="#"
            class="d-flex align-items-center text-white text-decoration-none"
            id="userDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-person-circle fs-3"></i>
          </a>
          <ul
            class="dropdown-menu dropdown-menu-end text-center"
            aria-labelledby="userDropdown"
          >
            <li><h6 class="dropdown-header" id="userName">Name</h6></li>
            <li>
              <span class="dropdown-item-text text-muted" id="userRole"
                >Role</span
              >
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a
                class="dropdown-item text-danger"
                id="logoutBtn"
                onclick="logout()"
                >Logout</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Admin Controls -->
    <div
      class="container mt-4 text-end"
      id="adminControls"
      style="display: none"
    >
      <button
        class="btn btn-success"
        data-bs-toggle="modal"
        data-bs-target="#addCourseModal"
      >
        + Add New Course
      </button>
    </div>

    <!-- Filter Section -->
    <section class="container my-4">
      <label for="categoryFilter" class="form-label">Filter by Category:</label>
      <select id="categoryFilter" class="form-select w-auto">
        <option value="all">All</option>
        <option value="programming">Programming</option>
        <option value="design">Design</option>
        <option value="marketing">Marketing</option>
        <option value="business">Business</option>
        <option value="data-science">Data Science</option>
      </select>
    </section>

    <!-- Search Courses -->
    <div class="container mb-4">
      <label for="searchInput" class="form-label"
        >Search Courses by Title:</label
      >
      <input
        type="text"
        id="searchInput"
        class="form-control w-50"
        placeholder="Type to search..."
      />
    </div>

    <!-- Course Cards -->
    <section class="container">
      <div class="row" id="courseList"></div>
    </section>

    <!-- Video Modal -->
    <div
      class="modal fade"
      id="videoModal"
      tabindex="-1"
      aria-labelledby="videoModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="videoModalLabel">Course Preview</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="ratio ratio-16x9">
              <iframe
                id="videoFrame"
                src=""
                allowfullscreen
                allow="autoplay"
              ></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add/Edit Course Modal -->
    <div
      class="modal fade"
      id="addCourseModal"
      tabindex="-1"
      aria-labelledby="addCourseModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="courseForm">
            <div class="modal-header">
              <h5 class="modal-title text-primary" id="addCourseModalLabel">
                Add / Edit Course
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="editIndex" />

              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" required />
              </div>

              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" required>
                  <option value="">Select</option>
                  <option value="programming">Programming</option>
                  <option value="design">Design</option>
                  <option value="marketing">Marketing</option>
                  <option value="business">Business</option>
                  <option value="data-science">Data Science</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea
                  class="form-control"
                  id="description"
                  rows="3"
                  required
                ></textarea>
              </div>

              <div class="mb-3">
                <label for="video" class="form-label">Video URL</label>
                <input type="url" class="form-control" id="video" required />
              </div>

              <div class="mb-3">
                <label for="thumbnail" class="form-label">Thumbnail URL</label>
                <input
                  type="url"
                  class="form-control"
                  id="thumbnail"
                  required
                />
              </div>
            </div>

            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">Save Course</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Review Modal -->
    <div
      class="modal fade"
      id="reviewModal"
      tabindex="-1"
      aria-labelledby="reviewModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="reviewModalLabel">Course Reviews</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <h6 id="reviewCourseTitle" class="text-primary"></h6>
            <div id="reviewList" class="mb-3"></div>
            <textarea
              id="newReviewText"
              class="form-control"
              placeholder="Write a review..."
            ></textarea>
          </div>
          <div class="modal-footer">
            <button id="submitReviewBtn" class="btn btn-primary">Submit</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <!-- Add this right before closing </body> -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const user = JSON.parse(localStorage.getItem("loggedInUser"));

    if (user) {
      document.getElementById("userName").textContent = user.name;
      document.getElementById("userRole").textContent = user.role;
      if (user.role === "admin") {
        document.getElementById("adminControls").style.display = "block";
      }
    }

    // Logout functionality
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        localStorage.removeItem("loggedInUser");
        location.hash = "login";
      });
    }

    // Button event delegation
    document.getElementById("courseList").addEventListener("click", (e) => {
      const index = e.target.closest("button")?.dataset.index;

      // Preview
      if (e.target.closest(".preview-btn")) {
        const videoUrl = e.target.closest("button").dataset.video;
        document.getElementById("videoFrame").src = videoUrl;
      }

      // Edit
      if (e.target.closest(".edit-btn")) {
        const courses = JSON.parse(localStorage.getItem("courses")) || [];
        const course = courses[index];
        if (course) {
          document.getElementById("editIndex").value = index;
          document.getElementById("title").value = course.title;
          document.getElementById("category").value = course.category;
          document.getElementById("description").value = course.description;
          document.getElementById("video").value = course.video;
          document.getElementById("thumbnail").value = course.thumbnail;
        }
      }

      // Delete
      if (e.target.closest(".delete-btn")) {
        if (confirm("Are you sure you want to delete this course?")) {
          let courses = JSON.parse(localStorage.getItem("courses")) || [];
          courses.splice(index, 1);
          localStorage.setItem("courses", JSON.stringify(courses));
          location.reload(); // re-render
        }
      }

      // Reviews
      if (e.target.closest(".review-btn")) {
        const courses = JSON.parse(localStorage.getItem("courses")) || [];
        const course = courses[index];
        document.getElementById("reviewCourseTitle").textContent = course.title;
        document.getElementById("reviewList").innerHTML = course.reviewsText?.join("<hr>") || "No reviews yet.";

        // Save review
        document.getElementById("submitReviewBtn").onclick = () => {
          const text = document.getElementById("newReviewText").value.trim();
          if (text) {
            course.reviewsText = course.reviewsText || [];
            course.reviewsText.push(text);
            localStorage.setItem("courses", JSON.stringify(courses));
            location.reload();
          }
        };
      }
    });

    // Save (add/edit) course
    document.getElementById("courseForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value;
      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value;
      const video = document.getElementById("video").value;
      const thumbnail = document.getElementById("thumbnail").value;
      const index = document.getElementById("editIndex").value;

      let courses = JSON.parse(localStorage.getItem("courses")) || [];

      const newCourse = { title, category, description, video, thumbnail, reviews: 5 };

      if (index !== "") {
        courses[+index] = newCourse;
      } else {
        courses.push(newCourse);
      }

      localStorage.setItem("courses", JSON.stringify(courses));
      location.reload();
    });

    // Initial rendering
    setupCourses(); // Load from your main.js
  });
</script>


  </body>
</html>
