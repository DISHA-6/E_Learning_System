<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Rated Courses</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      body {
        background-color: #ffffff;
        color: rgb(9, 9, 9);
        font-family: "Roboto", sans-serif;
      }

      .card {
        background-color: #2e2e2e;
        border: none;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        color: white;
      }

      .card img {
        height: 160px;
        object-fit: contain;
        padding: 10px;
      }

      .carousel-control-prev-icon,
      .carousel-control-next-icon {
        background-color: #2d2828;
        border-radius: 50%;
      }

      .carousel-inner {
        padding: 30px 0;
      }

      .enroll-btn {
        background-color: orange;
        border: none;
        color: black;
        font-weight: bold;
      }

      .fa-star,
      .fa-star-half-alt,
      .far.fa-star {
        margin-right: 2px;
      }

      @media (max-width: 768px) {
        .carousel-item .d-flex {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <nav
      class="d-flex justify-content-between align-items-center px-4 py-2"
      style="background-color: #4d78b9"
    >
      <!-- Logo -->
      <a href="/" class="nav-logo d-flex align-items-center">
        <img
          src="/assets/images/image.jpg"
          alt="EduSphere Logo"
          style="height: 50px"
        />
      </a>

      <!-- Navigation Links -->
      <div class="nav-links d-flex align-items-center gap-4">
        <a href="#home" class="text-white">Home</a>
        <a href="#courses" class="text-white"
          >Courses</a
        >
        <a
          href="#topratedcourses"
          class="text-white"
          >Top Rated Courses</a
        >

        <!-- User Dropdown -->
        <div class="dropdown">
          <a
            href="#"
            class="d-flex align-items-center text-white text-decoration-none"
            id="userDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-person-circle fs-3"></i>
          </a>

          <ul
            class="dropdown-menu dropdown-menu-end text-center"
            aria-labelledby="userDropdown"
          >
            <li><h6 class="dropdown-header" id="userName">Name</h6></li>
            <li>
              <span class="dropdown-item-text text-muted" id="userRole"
                >Role</span
              >
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a
                class="dropdown-item text-danger"
                id="logoutBtn"
                onclick="logout()"
                >Logout</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <h2 class="text-center mb-4">Top Rated Courses</h2>
      <div
        id="courseCarousel"
        class="carousel slide"
        data-bs-ride="carousel"
        data-bs-interval="5000"
      >
        <div class="carousel-inner" id="carouselContent">
          <!-- Dynamic content inserted here -->
        </div>

        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#courseCarousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#courseCarousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>

  </body>
</html>
