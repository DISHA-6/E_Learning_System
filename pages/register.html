<!-- Fonts & CSS -->
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />

<!-- Background Wrapper -->
<div style="
  font-family: Arial, sans-serif;
  background: url('/E_Learning_System/assets/images/login1.jpg') no-repeat center center fixed;
  background-size: cover;
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
">

  <!-- Register Container -->
  <div class="login-container" style="
    background-color: rgba(22, 28, 93, 0.75);
    padding: 60px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 550px;
    text-align: center;
  ">

    <h1 style="
      color: #f9f9f9;
      font-family: 'Lobster', cursive;
      font-size: 50px;
      margin-bottom: 35px;
    ">Register</h1>

    <form id="registerForm">
      <input type="text" id="name" placeholder="Full Name" required style="
        width: 100%;
        padding: 14px;
        margin: 12px 0 20px;
        border: 2px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        background-color: #f0f4ff;
      " />

      <input type="email" id="email" placeholder="Email Address" required style="
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border: 2px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        background-color: #f0f4ff;
      " />

      <input type="password" id="password" placeholder="Password" required style="
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border: 2px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        background-color: #f0f4ff;
      " />

      <input type="password" id="confirmPassword" placeholder="Confirm Password" required style="
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border: 2px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        background-color: #f0f4ff;
      " />

      <select id="role" required style="
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border: 2px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        background-color: #f0f4ff;
      ">
        <option value="" disabled selected>Select Role</option>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>

      <p id="registerError" style="color: red; font-size: 16px; margin-bottom: 10px;"></p>

      <button type="submit" style="
        width: 100%;
        padding: 14px;
        background-color: #2575fc;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 17px;
        cursor: pointer;
      ">Register</button>
    </form>

    <div class="register" style="margin-top: 25px; font-size: 15px; color: #eee;">
      <p>
        Already have an account?
        <a href="/index.html#login" style="color: #91c9ff; text-decoration: none;">Login here</a>
      </p>
    </div>

  </div>
</div>
