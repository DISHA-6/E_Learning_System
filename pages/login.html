<link rel="stylesheet" href="/css/styles.css" />

<!-- Login Page Background and Centering -->
<style>
 body {
   background: url('../assets/images/login1.jpg') no-repeat center center fixed;
   background-size: cover;
   margin: 0;
   height: 100vh;
   display: flex;
   justify-content: center;
   align-items: center;
   font-family: Arial, sans-serif;
  }
</style>

  <!-- Login Container -->
  <div class="login-container" style="
    background-color: rgba(22, 28, 93, 0.75);
    padding: 60px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 550px;
    text-align: center;
  ">
    <h1 style="
      color: #f9f9f9;
      font-family: 'Lobster', cursive;
      font-size: 50px;
      margin-bottom: 35px;
    ">Login</h1>

    <!-- Login Form -->
    <form id="loginForm">
      <input type="text" id="username" placeholder="Email Address" required style="
        width: 100%;
        padding: 14px;
        margin: 12px 0 20px;
        border: 2px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        background-color: #f0f4ff;
      " />

      <input type="password" id="password" placeholder="Password" required style="
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border: 2px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        background-color: #f0f4ff;
      " />

      <p id="loginError" style="
        margin-top: -10px;
        margin-bottom: 15px;
        color: red;
        font-size: 25px;
        font-weight: bolder;
      "></p>

      <button type="submit" style="
        width: 100%;
        padding: 14px;
        background-color: #2575fc;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 17px;
        cursor: pointer;
      ">Login</button>
    </form>

    <!-- Register Prompt -->
    <div class="register" style="margin-top: 25px; font-size: 15px; color: #eee;">
      <p>
        Don't have an account?
        <a href="/index.html#register" style="color: #91c9ff; text-decoration: none;">Register here</a>
      </p>
      <p style="color: #ffd700; margin-top: 10px;">
        If you're not registered, please register first to access the platform.
      </p>
    </div>
  </div>
</div>
